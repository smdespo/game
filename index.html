<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Shadow Fighter</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-container"></div>

  <!-- Touch / mouse controls. They only write into the shared input state in game.js -->
  <div id="controls">
    <div id="joystick"><div id="joy-knob"></div></div>
    <div id="buttons">
      <button class="act" data-act="jump"><svg viewBox="0 0 24 24"><path d="M6 15l6-7 6 7"/><path d="M6 20l6-7 6 7" opacity=".6"/></svg><span>JUMP</span></button>
      <button class="act" data-act="punch"><svg viewBox="0 0 24 24"><path d="M5 12h9"/><path d="M11 6l7 6-7 6"/><circle cx="20" cy="12" r="1.2"/></svg><span>PUNCH</span></button>
      <button class="act" data-act="kick"><svg viewBox="0 0 24 24"><path d="M6 5l6 8h8"/><path d="M12 13l-4 7"/></svg><span>KICK</span></button>
      <button class="act" data-act="block"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.500-7-4.500-7-9V6z"/></svg><span>BLOCK</span></button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
